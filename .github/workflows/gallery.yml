name: Deploy Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Inter is the font the themes name first; without it the site's pictures of the slides
      # fall back to the runner's wider DejaVu Sans.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-inter
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      # CI skips a push that changes only the documentation or the website, so they are
      # checked here, and a page that fails is never published.
      - name: Check the documentation
        run: npm run docs:check
      - name: Build Gallery
        run: npm run build:gallery
        env:
          # The download pages read the latest release, as the workflow's own token can.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Test Gallery
        run: node scripts/gallery-test.mjs
      - name: Upload Gallery artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/gallery

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
