name: CI

# A change only to the documentation or the website is checked by the Deploy Gallery
# workflow, which tests both before it publishes them; a push with any other file runs it all.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "gallery/**"
      - "README.md"
      - "README.zh-CN.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "gallery/**"
      - "README.md"
      - "README.zh-CN.md"

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install dependencies
        run: npm ci
      - name: Run release checks
        run: npm run release:check

  # The FrameSeq app's window for the Studio compiles; the app workflow builds it for release.
  desktop-window:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Cache the window's build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-check-${{ hashFiles('desktop/Cargo.lock') }}
      - name: Check the window
        run: node scripts/desktop-build.mjs --check
