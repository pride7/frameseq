name: Desktop app

# FrameSeq as an application that needs no Node.js: an installer and a portable zip for Windows,
# disk images for both kinds of Mac, and archives for Linux, each with the Studio's own window,
# built from desktop/ with Rust on the system it is for. A version tag attaches them to the
# GitHub release; a manual run leaves them as workflow artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            arch: x64
          - runner: macos-latest
            platform: darwin
            arch: arm64
          - runner: macos-latest
            platform: darwin
            arch: x64
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          # An Intel Mac's window is built on an Apple silicon runner.
          if [ "${{ matrix.platform }}" = darwin ] && [ "${{ matrix.arch }}" = x64 ]; then
            rustup target add x86_64-apple-darwin
          fi
      - name: Install WebKitGTK
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Cache the window's build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('desktop/Cargo.lock') }}
      - name: Install Inno Setup
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build the app
        run: node scripts/app-bundle.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: frameseq-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            output/app/*.exe
            output/app/*.zip
            output/app/*.dmg
            output/app/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the apps
        uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: List their checksums
        working-directory: apps
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "FrameSeq ${{ github.ref_name }}" --notes "See CHANGELOG.md for what changed."
          gh release upload "${{ github.ref_name }}" apps/* --repo "${{ github.repository }}" --clobber
