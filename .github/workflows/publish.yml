name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tagged commit went through CI on its way to main, so this waits for that run to have
  # passed, or for the run the tag itself starts, rather than running every test a second time.
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release tag and package versions
        if: github.event_name == 'push'
        run: node scripts/release-tag-test.mjs "${{ github.ref_name }}"
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 70); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 --json status,conclusion,url)"
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed on $GITHUB_SHA: $(jq -r '[.[] | select(.conclusion == "success")][0].url' <<<"$runs")"
              exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then
              echo "::error::CI did not pass on $GITHUB_SHA; fix it and tag a commit it passes on."
              exit 1
            fi
            sleep 30
          done
          echo "::error::No CI run on $GITHUB_SHA finished within 35 minutes."
          exit 1

  publish-frameseq:
    if: github.event_name == 'push'
    needs: release-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.5.1
      - name: Install dependencies
        run: npm ci
      # The FrameSeq app takes this version as an update only where it was built on the same
      # runtime, as the published package.json's appRuntime says.
      - name: Stamp the app's runtime
        run: node scripts/app-runtime.mjs --stamp
      - name: Publish FrameSeq
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@pride7/frameseq@$VERSION" version >/dev/null 2>&1; then
            echo "@pride7/frameseq@$VERSION is already published; skipping."
          else
            npm publish --access=public
          fi

  publish-create-frameseq:
    if: github.event_name == 'push'
    needs: release-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.5.1
      - name: Publish project creator
        working-directory: packages/create-frameseq
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "create-frameseq@$VERSION" version >/dev/null 2>&1; then
            echo "create-frameseq@$VERSION is already published; skipping."
          else
            npm publish --access=public
          fi

  publish-vscode-extension:
    needs: release-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install extension dependencies
        working-directory: packages/vscode-frameseq
        run: npm ci
      - name: Publish VS Code extension
        working-directory: packages/vscode-frameseq
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --no-dependencies --skip-duplicate
