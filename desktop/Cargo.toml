[package]
name = "frameseq-studio"
version = "0.0.0"
description = "FrameSeq Studio in a window of its own"
license = "MIT"
edition = "2021"
publish = false

[[bin]]
name = "frameseq-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde_json = "1"
tauri-plugin-opener = "2.7"

[features]
# `tauri build` turns this on; a plain `cargo build --release` needs it to serve the splash page
# from the binary instead of a development server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
